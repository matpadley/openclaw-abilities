name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install pytest -r abilities/pdc_darts_notifications/requirements.txt

      - name: Run tests
        run: pytest abilities/pdc_darts_notifications/tests/ -v
